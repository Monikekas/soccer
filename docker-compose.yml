
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: soccer-sql-server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en .env}"
    ports:
      - "1433:1433"
    volumes:
      - sql_server_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -C
        - -Q
        - "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    environment:
      DB_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en .env}"
    volumes:
      - ./DB/db_soccer.sql:/scripts/db_soccer.sql:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        SQLCMD=/opt/mssql-tools/bin/sqlcmd

        until "$$SQLCMD" -S db -U sa -P "$$DB_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; do
          echo "Esperando SQL Server..."
          sleep 3
        done

        EXISTS=$$("$$SQLCMD" -S db -U sa -P "$$DB_PASSWORD" -C -h -1 -W -Q "SET NOCOUNT ON; SELECT DB_ID('db_soccer')" | tr -d '[:space:]')

        if [ -z "$$EXISTS" ] || [ "$$EXISTS" = "NULL" ]; then
          echo "Inicializando db_soccer..."
          "$$SQLCMD" -S db -U sa -P "$$DB_PASSWORD" -C -b -i /scripts/db_soccer.sql
        else
          echo "db_soccer ya existe; se conserva."
        fi

  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    ports:
      - "5188:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SoccerDb: "Server=db,1433;Database=db_soccer;User Id=sa;Password=${DB_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: "Soccer_Test_Key_2026_MakeItLongEnough_123456789"
      Jwt__Issuer: api-soccer
      Jwt__Audience: angular-soccer
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  client:
    build:
      context: ./CLIENT
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sql_server_data:
    name: soccer_sql_server_data
